[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_router"
version = "0.1.0"
description = "Budget-aware, auditable LLM router with independent verification and a learning model selector."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rafael Lins Gaspar" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
google = ["google-genai>=1.0"]
repair = ["json-repair>=0.30"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://rafaellinsrj.github.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_router = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
